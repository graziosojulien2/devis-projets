<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F3EC">
<meta name="robots" content="noindex">
<title>Nidé – Suivi de grossesse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="vendor/fonts.css">
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script>window.PDF_WORKER = "vendor/pdf.worker.min.js";</script>
<style>
  :root {
    /* Thème bohème blanc — lin, sable, eucalyptus, terracotta douce, fil doré */
    --lin: #F7F3EC; --lin-2: #FBF8F2; --papier: #FFFDF9; --sable: #EDE4D6; --sable-2: #E6DCCB; --sable-3: #F0E8DB;
    --encre: #3A3029; --encre-2: #4A3F37; --brun: #5C5148; --muted-c: #6E6257;
    --euca: #4E6349; --euca-d: #3A4B36; --euca-l: #E6EDE2; --euca-m: #6F8A68;
    --terra: #9A5A40; --terra-d: #6E3A26; --terra-l: #F6E9E0; --terra-m: #D9B9A5;
    --or: #B08D57; --or-l: #E2CFB4;
    --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Jost', system-ui, sans-serif;

    /* Correspondance avec les anciennes couleurs du code */
    --teal-50: var(--euca-l); --teal-100: #C9D6C4; --teal-200: #A8BBA1; --teal-400: var(--euca-m);
    --teal-600: var(--euca); --teal-800: var(--euca-d); --teal-900: #2A3527;
    --blue-50: #E8EEF2; --blue-100: #C9D6DF; --blue-200: #A9BCCA; --blue-400: #6F8799;
    --blue-600: #4F6575; --blue-800: #3A4C59; --blue-900: #26333C;
    --gray-50: var(--sable-3); --gray-100: var(--sable-2); --gray-200: #CFC2AE; --gray-400: #9A8E80;
    --gray-600: var(--brun); --gray-800: var(--encre-2); --gray-900: var(--encre);
    --green-50: var(--euca-l); --green-400: var(--euca-m); --green-600: var(--euca); --green-800: var(--euca-d);
    --amber-50: #F8EEDD; --amber-400: #B9832F; --amber-600: #8A5E1C;
    --coral-50: var(--terra-l); --coral-400: #C47A5A; --coral-600: var(--terra);
    --red-50: #F7E4DF; --red-400: #B5523F; --red-600: #8E3A2B;
    --bg: var(--lin); --card: var(--papier); --border: var(--sable-2);
    --text: var(--encre); --text-muted: var(--muted-c);
    --accent: var(--euca); --accent-dark: var(--euca-d);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.5; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 600; letter-spacing: -0.005em; }
  :focus-visible { outline: 2.5px solid var(--euca); outline-offset: 2px; border-radius: 8px; }

  /* ── Cadre : barre latérale + contenu ── */
  .app-shell { display: flex; min-height: 100vh; }
  .side { width: 260px; flex-shrink: 0; background: var(--lin-2); border-right: 1px solid var(--sable-2); padding: 32px 22px 22px; display: flex; flex-direction: column; gap: 26px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; flex-direction: column; gap: 4px; cursor: pointer; background: none; border: none; text-align: left; color: inherit; font: inherit; }
  .brand-name { font-family: var(--serif); font-size: 34px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; }
  .brand-sub { color: var(--muted-c); font-size: 14px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-btn { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 14px; border-radius: 999px; border: none; background: transparent; color: var(--brun); font-family: var(--sans); font-size: 15px; cursor: pointer; transition: background .15s, color .15s; }
  .nav-btn:hover { background: var(--sable-3); color: var(--encre); }
  .nav-btn.active { background: var(--sable); color: var(--encre); font-weight: 600; }
  .nav-btn .dot { display: none; }
  .nav-btn .ico { width: 20px; height: 20px; flex-shrink: 0; }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--muted-c); }
  .sync { display: flex; align-items: center; gap: 8px; }
  .sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--euca-m); flex-shrink: 0; }
  .sync.pending i { background: var(--or); animation: pulse 1s ease-in-out infinite; }
  .sync.error i { background: var(--terra); }
  @keyframes pulse { 50% { opacity: .35; } }
  .side-link { background: none; border: none; text-align: left; font: inherit; color: var(--brun); cursor: pointer; padding: 6px 0; }
  .side-link:hover { color: var(--encre); text-decoration: underline; }
  .main { flex: 1; min-width: 0; }
  .content { padding: 40px 48px 64px; max-width: 1120px; width: 100%; }
  .mobile-top, .bottom-nav { display: none; }

  /* anciens éléments de la barre du haut, réutilisés */
  .api-btn { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--sable-2); background: var(--papier); color: var(--brun); font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: var(--sans); }
  .api-btn:hover { border-color: var(--or); color: var(--encre); }
  .api-ok { color: var(--euca-d); border-color: var(--teal-200); }

  /* ── Surfaces ── */
  .card { background: var(--papier); border: 1px solid var(--sable-2); border-radius: 22px; padding: 1.5rem 1.75rem; }
  .card-sm { padding: 1rem 1.25rem; border-radius: 16px; }
  .btn { padding: 11px 20px; border-radius: 999px; border: 1.5px solid var(--euca); background: var(--euca); color: #FBF8F2; font-family: var(--sans); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s; }
  .btn:hover { background: var(--euca-d); border-color: var(--euca-d); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-outline { background: transparent; color: var(--euca-d); border-color: #C9B79B; }
  .btn-outline:hover { background: var(--sable-3); border-color: var(--or); }
  .btn-sm { padding: 8px 15px; font-size: 0.85rem; }
  .btn-danger { background: var(--red-400); border-color: var(--red-400); }
  .btn-danger:hover { background: var(--red-600); border-color: var(--red-600); }
  .btn-terra { background: transparent; color: var(--terra); border-color: var(--terra-m); }
  .btn-terra:hover { background: var(--terra-l); }
  input[type=text], input[type=date], input[type=number], input[type=password], input[type=url], input[type=time], select, textarea {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--sable-2); border-radius: 12px; font-family: var(--sans); font-size: 0.95rem; color: var(--text); background: var(--lin); outline: none; transition: border .15s, background .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--euca-m); background: #fff; }
  input[type=checkbox] { accent-color: var(--euca); }
  input[type=range] { accent-color: var(--terra); width: 100%; }
  label { font-size: 0.82rem; font-weight: 600; color: var(--muted-c); margin-bottom: 5px; display: block; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
  .flex { display: flex; } .flex-col { display: flex; flex-direction: column; }
  .gap-1 { gap: 0.5rem; } .gap-2 { gap: 1rem; } .gap-3 { gap: 1.5rem; }
  .mb-1 { margin-bottom: 0.5rem; } .mb-2 { margin-bottom: 1rem; } .mb-3 { margin-bottom: 1.5rem; }
  .mt-1 { margin-top: 0.5rem; } .mt-2 { margin-top: 1rem; } .mt-3 { margin-top: 1.5rem; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .badge-teal, .badge-green { background: var(--euca-l); color: var(--euca-d); }
  .badge-blue { background: var(--blue-50); color: var(--blue-800); }
  .badge-amber { background: var(--terra-l); color: var(--terra-d); }
  .badge-red { background: var(--red-50); color: var(--red-600); }
  .badge-gray { background: var(--sable-3); color: var(--brun); }
  .stat-card { background: var(--papier); border: 1px solid var(--sable-2); border-radius: 18px; padding: 1rem 1.25rem; }
  .stat-label { font-size: 0.8rem; color: var(--muted-c); font-weight: 500; }
  .stat-value { font-family: var(--serif); font-size: 2.1rem; color: var(--encre); line-height: 1.1; margin-top: 2px; font-weight: 600; }
  .stat-sub { font-size: 0.8rem; color: var(--muted-c); margin-top: 2px; }
  .timeline-item { display: flex; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--sable-3); }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-dot { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1rem; background: var(--sable-3); color: var(--euca-d); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(58,48,41,0.38); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
  .modal { background: var(--papier); border-radius: 22px; padding: 2rem; width: min(580px, 95vw); max-height: 88vh; overflow-y: auto; box-shadow: 0 24px 60px rgba(58,48,41,0.22); }
  .ai-bubble { background: var(--lin-2); border: 1px solid var(--or-l); border-radius: 18px; padding: 1.25rem 1.4rem; position: relative; }
  .ai-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 600; color: var(--or); margin-bottom: 0.6rem; }
  .ai-tag::before { content: '✦'; font-size: 0.7rem; }
  .spinner { width: 30px; height: 30px; border: 3px solid var(--sable); border-top-color: var(--euca); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .agenda-item { display: flex; align-items: flex-start; gap: 1rem; padding: 1rem; border: 1px solid var(--sable-2); border-radius: 16px; background: var(--papier); }
  .progress-bar { height: 8px; background: var(--sable); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--euca-m); border-radius: 999px; transition: width 0.5s; }
  .doc-card { border: 1px solid var(--sable-2); border-radius: 18px; padding: 1rem 1.25rem; background: var(--papier); transition: border-color .15s; }
  .doc-card:hover { border-color: var(--or); }
  .drop-zone { border: 1.5px dashed #C9B79B; border-radius: 22px; padding: 2.4rem; text-align: center; transition: all 0.15s; background: var(--lin-2); }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--euca); background: var(--euca-l); }
  .section-title { font-family: var(--serif); font-size: 2.6rem; font-weight: 500; color: var(--text); margin-bottom: 1.5rem; line-height: 1.05; }
  .section-title span { color: inherit; font-style: italic; }
  .alert-bar { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 14px; font-size: 0.9rem; margin-bottom: 0.75rem; }
  .alert-warn { background: var(--terra-l); color: var(--terra-d); border: 1px solid var(--terra-m); }
  .alert-info { background: var(--euca-l); color: var(--euca-d); border: 1px solid #C9D6C4; }
  .echo-modal-img { width: 100%; max-height: 420px; object-fit: contain; border-radius: 12px; background: var(--sable-3); }
  .source-badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; }
  .toast-wrap { position: fixed; bottom: 18px; right: 18px; z-index: 3000; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
  .toast { background: var(--encre); color: #FBF8F2; padding: 12px 16px; border-radius: 14px; font-size: 0.88rem; box-shadow: 0 10px 30px rgba(58,48,41,0.25); line-height: 1.45; }
  .toast.err { background: var(--terra-d); }
  .job-bar { position: sticky; top: 0; z-index: 90; background: var(--encre); color: #FBF8F2; font-size: 0.85rem; padding: 9px 48px; display: flex; align-items: center; gap: 12px; }
  .job-bar .progress-bar { flex: 1; max-width: 320px; background: rgba(255,255,255,0.18); }
  .job-bar .progress-fill { background: var(--or-l); }
  .subnav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .pill { padding: 8px 15px; border-radius: 999px; border: 1px solid var(--sable-2); background: var(--papier); font-family: var(--sans); font-size: 0.86rem; color: var(--brun); cursor: pointer; }
  .pill:hover { border-color: var(--or); color: var(--encre); }
  .pill.active { background: var(--euca); border-color: var(--euca); color: #FBF8F2; font-weight: 600; }
  .st { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 0.74rem; font-weight: 600; white-space: nowrap; }
  .st-ok { background: var(--euca-l); color: var(--euca-d); }
  .st-none { background: var(--sable-3); color: var(--brun); }
  .st-pending { background: var(--terra-l); color: var(--terra-d); }
  .st-error { background: var(--red-50); color: var(--red-600); }
  .res-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
  .res-table th, .res-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--sable-3); vertical-align: top; }
  .res-table th { color: var(--muted-c); font-weight: 600; white-space: nowrap; position: sticky; top: 0; background: var(--papier); }
  .res-table td.name { font-weight: 500; min-width: 160px; }
  .res-table tr.clickable { cursor: pointer; }
  .res-table tr.clickable:hover td { background: var(--lin-2); }
  .rv { display: inline-block; padding: 2px 8px; border-radius: 8px; white-space: nowrap; }
  .rv-normal, .rv-negatif, .rv-immunise { background: var(--euca-l); color: var(--euca-d); }
  .rv-bas, .rv-haut, .rv-anormal, .rv-positif, .rv-non_immunise { background: var(--terra-l); color: var(--terra-d); font-weight: 600; }
  .rv-info { background: var(--sable-3); color: var(--encre-2); }
  .seance { margin-bottom: 1.5rem; }
  .seance-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .thumb { aspect-ratio: 4/3; border-radius: 12px; overflow: hidden; background: #2B211B; cursor: pointer; border: 1px solid var(--sable-2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lightbox { position: fixed; inset: 0; background: rgba(30,22,17,0.94); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; }
  .lightbox img { max-width: 100%; max-height: 78vh; border-radius: 12px; }
  .lightbox .lb-bar { display: flex; gap: 10px; margin-top: 1rem; align-items: center; color: #fff; font-size: 0.88rem; flex-wrap: wrap; justify-content: center; }
  .lb-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 9px 15px; border-radius: 999px; cursor: pointer; font-size: 0.88rem; font-family: var(--sans); }
  .big-btn { width: 100%; padding: 2rem 1rem; border-radius: 22px; border: none; font-family: var(--serif); font-size: 1.7rem; font-weight: 600; cursor: pointer; color: #FBF8F2; background: var(--euca); }
  .big-btn:active { transform: scale(0.99); }
  .big-btn.on { background: var(--terra); }
  .check-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--sable-3); font-size: 0.92rem; }
  .check-row:last-child { border-bottom: none; }
  .check-row input[type=checkbox] { width: 20px; height: 20px; flex-shrink: 0; }
  .check-row.done span.lbl { text-decoration: line-through; color: var(--muted-c); }
  .kv { display: flex; justify-content: space-between; gap: 1rem; padding: 7px 0; border-bottom: 1px solid var(--sable-3); font-size: 0.9rem; }
  .kv span:first-child { color: var(--muted-c); }
  .kv span:last-child { font-weight: 500; text-align: right; }
  .muted { color: var(--muted-c); }
  .small { font-size: 0.84rem; }
  .disclaimer { font-size: 0.78rem; color: var(--muted-c); font-style: italic; margin-top: 0.75rem; }
  .list-plain { padding-left: 1.1rem; font-size: 0.92rem; line-height: 1.7; }
  .h3 { font-family: var(--serif); color: var(--encre); font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; line-height: 1.15; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .loading-screen { min-height: 100vh; display: flex; flex-direction: column; gap: 1rem; align-items: center; justify-content: center; color: var(--muted-c); }
  a.btn { text-decoration: none; display: inline-flex; align-items: center; }
  a { color: var(--euca); }

  /* ── Connexion ── */
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .gate-card { width: 100%; max-width: 440px; background: var(--papier); border: 1px solid var(--sable-2); border-radius: 220px 220px 24px 24px; padding: 64px 36px 36px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; box-shadow: 0 20px 50px rgba(58,48,41,0.1); }
  .gate-title { font-size: 48px; font-weight: 600; line-height: 1; }
  .gate-btn { padding: 13px 24px; font-size: 1rem; margin-top: 8px; }
  .gate-err { color: var(--terra-d); background: var(--terra-l); border-radius: 12px; padding: 10px 14px; font-size: 0.9rem; }

  /* ── Accueil ── */
  .home-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 30px; }
  .home-head h1 { font-size: 58px; font-weight: 500; line-height: 1.02; letter-spacing: -0.015em; }
  .home-head p { color: var(--brun); font-size: 17px; margin-top: 6px; }
  .home-hero { display: flex; flex-wrap: wrap; gap: 28px; align-items: stretch; margin-bottom: 26px; }
  .arch { position: relative; border-radius: 260px 260px 22px 22px; overflow: hidden; border: 1px solid var(--or-l); background: #1C0F08; }
  .arch canvas { border-radius: 0 !important; }
  .arch-col { flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .side-col { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
  .week-figs { display: flex; gap: 30px; flex-wrap: wrap; margin-bottom: 10px; }
  .week-figs b { display: block; font-family: var(--serif); font-size: 40px; font-weight: 600; line-height: 1; }
  .week-figs span { color: var(--muted-c); font-size: 13px; }
  .frise { position: relative; height: 64px; margin-top: 8px; }
  .frise .track { position: absolute; left: 0; right: 0; top: 24px; height: 6px; border-radius: 999px; background: var(--sable); }
  .frise .done { position: absolute; left: 0; top: 24px; height: 6px; border-radius: 999px; background: #C9A27A; }
  .frise .dot { position: absolute; top: 19px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--papier); border: 2px solid var(--euca); cursor: pointer; padding: 0; }
  .frise .dot:hover { background: var(--euca-l); }
  .frise .now { position: absolute; top: 12px; width: 2px; height: 30px; background: var(--terra); }
  .frise .lbl { position: absolute; font-size: 12px; color: var(--muted-c); white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-family: var(--sans); font-size: 14px; min-height: 40px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--sable-2); background: transparent; color: var(--brun); cursor: pointer; }
  .chip:hover { border-color: var(--or); color: var(--encre); }
  .chip.on { border-color: var(--euca); background: var(--euca-l); color: var(--euca-d); font-weight: 600; }
  .todo-list { list-style: none; }
  .todo-list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--sable-3); }
  .todo-list li:last-child { border-bottom: none; }
  .eyebrow { font-size: 13px; color: var(--muted-c); }
  .pampa { display: block; }

  /* ── Frise des analyses ── */
  .matrix { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.9rem; }
  .matrix th, .matrix td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--sable-3); white-space: nowrap; }

  .album { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }

  .money { font-variant-numeric: tabular-nums; }
  .jourj { border-radius: 180px 180px 22px 22px; padding-top: 56px; }
  .jourj-head { text-align: center; margin-bottom: 16px; }
  .print-only { display: none; }
  @media print {
    body { background: #fff; }

    .content { padding: 0; max-width: none; }
    .card { border: none; padding: 0; }
    .print-only { display: block; }
  }

  /* ── Tablette / téléphone ── */
  @media (max-width: 1100px) {
    .content { padding: 28px 28px 56px; }
    .grid-4 { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 860px) {
    .side { display: none; }
    .mobile-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: var(--lin-2); border-bottom: 1px solid var(--sable-2); position: sticky; top: 0; z-index: 95; }

    .bottom-nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 96; background: var(--lin-2); border-top: 1px solid var(--sable-2); padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); }
    .bottom-nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; font-family: var(--sans); font-size: 11px; color: var(--muted-c); padding: 6px 0; min-height: 52px; cursor: pointer; }
    .bottom-nav button.active { color: var(--encre); font-weight: 600; }
    .bottom-nav .ico { width: 22px; height: 22px; }
    .content { padding: 20px 16px calc(100px + env(safe-area-inset-bottom)); }
    .job-bar { padding: 9px 16px; }

    .section-title { font-size: 2.1rem; }

    .modal-overlay { align-items: flex-end; padding: 0; }
    .drop-zone { padding: 1.5rem 1rem; }
    .stat-value { font-size: 1.6rem; }
    .arch { border-radius: 190px 190px 20px 20px; }
    input, select, textarea { font-size: 16px !important; }
    .toast-wrap { bottom: calc(80px + env(safe-area-inset-bottom)); }
  }
  .more-sheet { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .more-sheet button { text-align: left; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--sable-2); background: var(--lin-2); font-family: var(--sans); font-size: 15px; color: var(--encre); cursor: pointer; display: flex; align-items: center; gap: 10px; }

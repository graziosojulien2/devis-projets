name: Nidé – APK Android de test
on:
  push:
    paths: ['nide-app/**', '.github/workflows/nide-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nide-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#F7F3EC' --splashBackgroundColor '#F7F3EC'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk nide-test.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nide-test
          name: Nidé – version de test Android
          body: APK de test (non signé pour le Play Store). À installer sur un téléphone Android en autorisant les sources inconnues.
          prerelease: true
          files: nide-app/nide-test.apk
          make_latest: false
